<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Inline so the page makes no request the dev server would answer with a 404. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23070810'/%3E%3Cpath d='M4 16h4l3-9 4 18 4-13 3 8h6' fill='none' stroke='%2322d3ee' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <!--
      The two typefaces the design is drawn in. Both are optional: the stacks in
      `styles.css` fall back to system faces, so the playground is fully usable with
      no network — which matters, because "nothing is proxied through a service" is a
      claim this project makes about itself and a font request is the one place this
      file reaches out. Delete these three lines to make that absolute.

      One request can be added from outside this file: a build run with
      `YANDEX_METRIKA_ID` set injects a Yandex.Metrika counter, which is how the
      published site counts visitors. Unset — locally, in a fork, in CI's checks —
      nothing is injected and the built page is exactly this one. What ships, and the
      line of the stock snippet it does not use, is in `plugins/metrika.ts`.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>txt2sfx — soundline playground</title>
    <meta
      name="description"
      content="Describe a sound effect in words and get back compact procedural Web Audio code — typically 300–1000 bytes, zero dependencies — instead of an audio file."
    />

    <!--
      The share card.

      Absolute URLs, and pointing at the published site rather than at whatever host is
      serving this file: a scraper resolves these itself, from its own network, and a
      relative path or a localhost URL is a preview that renders as a bare link. That
      does mean a fork's deployment advertises this site until these five lines are
      edited, which is the honest trade — the alternative is a build-time substitution to
      spare a case that happens once.

      `og:image` is drawn by `assets/og-card.py`, which explains why it is a card rather
      than the screenshot: the screenshot's 1.30 aspect ratio is cropped by every
      timeline that wants 1.91, and it loses the two rows worth showing. Twitter reads
      the `og:*` tags for everything it can, so only the card type and the alt text need
      a `twitter:` twin.
    -->
    <link rel="canonical" href="https://txt2sfx.github.io/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="txt2sfx" />
    <meta property="og:url" content="https://txt2sfx.github.io/" />
    <meta property="og:title" content="txt2sfx — text-to-SFX as code" />
    <meta
      property="og:description"
      content="Sounds that weigh bytes, not megabytes. A prompt becomes a readable recipe, a validator checks it against the physics of its category, and the export is a few hundred bytes of Web Audio JavaScript with no dependencies."
    />
    <meta property="og:image" content="https://txt2sfx.github.io/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A three-line soundline recipe for a bubble pop, and the note that it exports as 876 bytes of Web Audio JavaScript with zero dependencies."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image:alt"
      content="A three-line soundline recipe for a bubble pop, and the note that it exports as 876 bytes of Web Audio JavaScript with zero dependencies."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
