# Install as /etc/nginx/sites-available/txt2sfx.pix3.dev and symlink into sites-enabled/.
#
# Every http-level name here is prefixed `bank_`. This host serves several sites from
# one nginx, and an unprefixed `limit_req_zone` collides with a neighbour's — nginx then
# refuses to start, taking every site down for a change to one of them.

# ## Two rate limits, and neither is the real one
#
# The bank enforces its own allowances per account, which is the limit that means
# anything: it knows who is asking and what they are asking for. These are the outer
# bound in front of it — they stop a flood from costing the *box* anything before the
# application has looked at it, and they are keyed by address because at this layer
# there is nothing else to key by.
#
# `bank_write` is deliberately generous per second and small in burst: publishing is a
# render, and a render is the one thing here that costs real CPU.
limit_req_zone $binary_remote_addr zone=bank_read:10m  rate=20r/s;
limit_req_zone $binary_remote_addr zone=bank_write:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=bank_conn:10m;

upstream bank_backend {
    server 127.0.0.1:8787;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name txt2sfx.pix3.dev;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name txt2sfx.pix3.dev;

    ssl_certificate     /etc/letsencrypt/live/txt2sfx.pix3.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/txt2sfx.pix3.dev/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # A recipe is a few hundred bytes and the largest body this API accepts is one with
    # a soundline and a comment in it. 64k is already two orders of magnitude of slack;
    # anything larger is not a recipe.
    client_max_body_size 64k;

    limit_conn bank_conn 24;

    # ## CORS is the application's, not nginx's
    #
    # The API answers every origin on purpose — someone else's agent, from someone
    # else's page, with no arrangements — and `@fastify/cors` already sets the headers
    # including the preflight. Adding them here would produce two `Access-Control-
    # Allow-Origin` headers, which browsers treat as none.

    location /api/ {
        limit_req zone=bank_read burst=40 nodelay;

        proxy_pass         http://bank_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # A publish renders the sound before it answers. Two seconds is generous for a
        # bounded render; the queue is what protects the box, not this number.
        proxy_read_timeout 30s;
    }

    # The three routes that cost a render or a write get the tighter bucket. Listed
    # explicitly rather than by method: nginx cannot rate-limit by method without a map,
    # and these are the paths that matter.
    location = /api/recipes {
        limit_req zone=bank_write burst=5 nodelay;

        proxy_pass         http://bank_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /api/health {
        proxy_pass http://bank_backend/api/health;
        access_log off;
    }

    # The moderation routes answer 404 to anyone without the admin token, so this is
    # belt and braces — but it costs one block and means a leaked token is still only
    # usable from this machine.
    location /api/moderation/ {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://bank_backend;
    }

    # ## The corpus, served as files
    #
    # The dump is what makes the bank throwaway: if this service disappears, the sounds
    # do not. Serving it from the same host costs nothing and means the promise can be
    # checked with a browser rather than taken on faith.
    location /corpus/ {
        alias /srv/txt2sfx/corpus/;
        autoindex on;
        add_header Access-Control-Allow-Origin "*" always;
        types { text/plain soundline; application/json jsonl; text/markdown md; }
        default_type text/plain;
    }

    # Nothing else lives here. The playground is a static site on another host, and a
    # bank that also answered `/` would invite somebody to point a domain at it.
    location / {
        return 404 '{"error":"no-route","message":"This is the txt2sfx recipe bank. Start at GET /api/llms.txt for the full contract."}';
        default_type application/json;
    }
}
