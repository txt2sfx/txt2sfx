name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per branch: a force-push while CI is running should not leave two
# answers about the same code. Only pull requests are cancelled, though — a run
# on `main` ends by publishing the site, and cancelling that mid-push would leave
# the front door half-written rather than superseded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only by default; the deploy job widens this for itself.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Both ends of the supported range. The lower bound is not about language
      # features: the recipe bank uses Node's built-in `node:sqlite`, whose SQLite
      # is compiled with FTS5 only from 22.16, in none of 23.x, and unconditionally
      # from 24. Testing 22.16 keeps that claim honest.
      matrix:
        node: ['22.16', '24']

    steps:
      - uses: actions/checkout@v5

      # No `version` input: the action reads `packageManager` from
      # `package.json` and refuses to run when both are set. That pin is the
      # single source of the pnpm version — the same one Corepack uses locally.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # There is no separate linter in this repository, on purpose: TypeScript
      # runs with `strict`, `noUncheckedIndexedAccess` and
      # `exactOptionalPropertyTypes`, and `tsconfig.test.json` type-checks the
      # tests as well as the sources — `tsc -b` alone covers only `src`, and a
      # test that fails to type usually still runs.
      - name: Typecheck sources, tests and the playground
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build packages and the server
        run: pnpm build

      - name: Build the playground
        run: pnpm build:web

      # A scripted model, so this is a regression check on the pipeline rather
      # than on a vendor: `--strict` fails the job when a target misses its
      # distance threshold.
      - name: Benchmark
        run: pnpm bench -- --strict

      # Exercises the one path tests cannot: a real SQLite file, FTS5 on this
      # Node, and the renderer measuring every reference recipe and preset — sixty
      # renders in all. Not `--strict` — `helicopter` is knowingly out of contract,
      # and the seeder is documented to load it and report it. A preset that fails
      # validation or clips is caught by `test/presets.test.ts` and the seeder's
      # report before it gets here; `--strict` would refuse it outright.
      - name: Seed the recipe bank (smoke)
        run: pnpm --filter @txt2sfx/server seed

  # The playground is published only from `main`, and only behind a green
  # `verify` — the site is the project's front door, so "it builds" is not a
  # sufficient bar when the typecheck, the tests and the bench are what say the
  # generator still works.
  #
  # ## Why the site lives in another repository
  #
  # `https://txt2sfx.github.io/` — no subdirectory — is served by exactly one
  # repository, the one named `txt2sfx.github.io`, and it is not this one. So this
  # job builds here, where the tests are, and pushes the built tree there, where
  # the origin is. The alternative was renaming this repository to
  # `txt2sfx.github.io`, which would have made a monorepo that is also the source
  # of an npm package answer to a hostname, and would have broken npm's trusted
  # publisher until its settings were changed to match.
  #
  # The cost is a stored credential, and it is the narrowest one that does the
  # job: `GITHUB_TOKEN` is scoped to this repository alone and OIDC
  # (`deploy-pages`) can only deploy to the repository running the workflow, so a
  # cross-repository push needs its own key. `PAGES_DEPLOY_KEY` is a deploy key —
  # write access to that one repository and nothing else, no expiry, and its whole
  # blast radius is overwriting a public static site, which is what this job does
  # on purpose. A fine-grained PAT would have been broader (scoped to a person)
  # and would have needed rotating.
  #
  # The build is not reused from `verify` above: that job is a two-Node matrix, so
  # reusing its output would mean choosing which Node's build the world sees, and
  # there is no good answer to that. It is now the *same* build a developer gets
  # locally, though — an organization site is served from the root, so there is no
  # asset prefix to pass any more, and `configure-pages` is gone with it.
  #
  # Nothing server-side ships here. The playground is static by construction: the
  # write-back and Stable Audio endpoints are `apply: 'serve'` dev plugins, the
  # recipe gallery falls back to its bundled `import.meta.glob` snapshot, and the
  # model key is pasted by the visitor into their own tab.
  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read # the push is authenticated by the deploy key, not by this

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # No `PAGES_BASE_PATH`: an organization site is served from the root, which
      # is `vite.config.ts`'s default. See the note there.
      #
      # `YANDEX_METRIKA_ID` is the only thing that makes this build differ from the
      # one `verify` and a developer produce, and it is set *here* rather than in
      # `index.html` so that only the published site reports into the counter. A
      # repository variable, not a secret: the id is readable in the page source of
      # every site that runs one, and masking it in the log would buy nothing while
      # making an empty value look the same as a missing one. Undefined, the step
      # publishes a site with no counter at all.
      - name: Build the playground
        env:
          YANDEX_METRIKA_ID: ${{ vars.YANDEX_METRIKA_ID }}
        run: pnpm build:web

      # The guard is the point. The next step is `rsync --delete` over the live
      # site, so a build that silently produced nothing would publish an empty
      # front door rather than fail. Cheap, and it fails where the reason is.
      - name: Refuse to publish an empty build
        run: |
          test -f apps/web/dist/index.html || { echo "no dist/index.html — not publishing"; exit 1; }
          echo "built $(find apps/web/dist -type f | wc -l) files"

      - name: Publish to txt2sfx/txt2sfx.github.io
        env:
          DEPLOY_KEY: ${{ secrets.PAGES_DEPLOY_KEY }}
          SITE: git@github.com:txt2sfx/txt2sfx.github.io.git
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY" || { echo "PAGES_DEPLOY_KEY is not set"; exit 1; }

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # GitHub's own host keys, over TLS, rather than `ssh-keyscan` — which
          # trusts whatever answers on port 22. This also survives the key
          # rotations `ssh-keyscan` would silently accept.
          curl -fsS https://api.github.com/meta \
            | jq -r '.ssh_keys[] | "github.com \(.)"' >> ~/.ssh/known_hosts

          git clone --depth 1 "$SITE" site

          # `--delete` so a file that left the build leaves the site; `.git`
          # excluded, or the clone would delete its own history.
          rsync -a --delete --exclude .git apps/web/dist/ site/
          # Pages runs Jekyll over a branch-served tree unless told not to, and
          # Jekyll drops paths beginning with an underscore.
          touch site/.nojekyll

          # Read out of the checkout, never through a GitHub expression: a commit
          # subject is author-controlled text, and an expression would splice it
          # into this script before bash ever saw it as data. (Do not write the
          # expression delimiters even in a comment — Actions parses them here too,
          # and an empty one fails the whole workflow before any step runs.)
          subject=$(git -C "$GITHUB_WORKSPACE" log -1 --pretty=%s)

          cd site
          git add -A
          if git diff --cached --quiet; then
            echo "the built site is byte-identical to what is published — nothing to do"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "deploy: ${GITHUB_SHA:0:8} ${subject}" \
                     -m "From ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          git push origin HEAD:main
          echo "published to https://txt2sfx.github.io/"
